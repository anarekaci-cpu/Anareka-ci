name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  html-validate:
    name: Validate HTML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download Nu Html Checker
        run: curl -sL "https://github.com/validator/validator/releases/latest/download/vnu.jar" -o vnu.jar

      - name: Validate HTML files
        run: |
          files=$(find . -name '*.html' -not -name 'google*.html' -not -path './.git/*')
          java -jar vnu.jar --skip-non-html $files

  check-local-links:
    name: Check local links & image references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for broken local references
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline
            --no-progress
            --exclude-path .git
            --root-dir .
            .
          fail: true
