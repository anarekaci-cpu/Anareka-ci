name: CI

# Décision d'architecture (Lot 6) : ce site reste volontairement sans étape
# de build (pages HTML dupliquées à la main, gabarit commun copié-collé,
# garde-fou CI check-page-scaffold à la place d'un système de composants)
# tant que ces deux conditions restent vraies :
#   1. Le nombre total de pages HTML reste sous ~30.
#   2. Le site reste bilingue (FR + EN au plus).
# Si une 3e langue apparaît, ou si les articles de blog doivent être
# traduits (aujourd'hui volontairement FR-only, voir Lot 6), rouvrir la
# question d'un build (SSG, templating) plutôt que d'empiler indéfiniment
# la duplication manuelle. Ne pas trancher ça au coup par coup.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  html-validate:
    name: Validate HTML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download Nu Html Checker
        run: curl -sL "https://github.com/validator/validator/releases/latest/download/vnu.jar" -o vnu.jar

      - name: Validate HTML files
        run: |
          files=$(find . -name '*.html' -not -name 'google*.html' -not -path './.git/*' -not -path './templates/*')
          # Filtre unique et ciblé : le Nu Html Checker ne reconnaît pas encore
          # @view-transition (CSS View Transitions Level 2, très récent), une
          # règle pourtant valide et gérée nativement par Chrome — confirmé en
          # inspectant le CSSOM du navigateur. Ne masque aucune autre erreur.
          java -jar vnu.jar --skip-non-html --filterpattern ".*Unrecognized at-rule.*view-transition.*" $files

  check-local-links:
    name: Check local links & image references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for broken local references
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline
            --no-progress
            --exclude-path .git
            --exclude-path templates
            --root-dir .
            --fallback-extensions html
            .
          fail: true

  minify-check:
    name: Minification dry-run (HTML/CSS/JS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install minifiers
        run: npm install --no-save html-minifier-terser csso-cli terser

      - name: Minify HTML/CSS/JS to a scratch dir and report savings
        run: |
          set -e
          mkdir -p /tmp/minified
          orig_total=0
          min_total=0

          html_files=$(find . -name '*.html' -not -path './.git/*' -not -path './templates/*')
          for f in $html_files; do
            out="/tmp/minified/$(basename "$f")"
            npx html-minifier-terser \
              --collapse-whitespace --remove-comments \
              --minify-css true --minify-js true \
              -o "$out" "$f"
            o=$(stat -c%s "$f"); m=$(stat -c%s "$out")
            orig_total=$((orig_total+o)); min_total=$((min_total+m))
            printf '%-55s %8d -> %8d bytes\n' "$f" "$o" "$m"
          done

          for f in style.css; do
            out="/tmp/minified/$(basename "$f")"
            npx csso-cli "$f" -o "$out"
            o=$(stat -c%s "$f"); m=$(stat -c%s "$out")
            orig_total=$((orig_total+o)); min_total=$((min_total+m))
            printf '%-55s %8d -> %8d bytes\n' "$f" "$o" "$m"
          done

          for f in script.js; do
            out="/tmp/minified/$(basename "$f")"
            npx terser "$f" --compress --mangle -o "$out"
            o=$(stat -c%s "$f"); m=$(stat -c%s "$out")
            orig_total=$((orig_total+o)); min_total=$((min_total+m))
            printf '%-55s %8d -> %8d bytes\n' "$f" "$o" "$m"
          done

          saved=$((orig_total-min_total))
          pct=$(( 100 * saved / orig_total ))
          {
            echo "### Minification dry-run"
            echo ""
            echo "This job only verifies HTML/CSS/JS minify cleanly and reports potential"
            echo "savings — it does not modify the repo or affect deployment. Cloudflare"
            echo "Pages deploys directly from this repo's source files."
            echo ""
            echo "**Total: ${orig_total} → ${min_total} bytes (saved ${saved} bytes, ${pct}%)**"
          } >> "$GITHUB_STEP_SUMMARY"

  check-page-scaffold:
    name: Cohérence du scaffold entre pages (nav, footer, version, copyright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install HTML parser
        run: npm install --no-save node-html-parser

      - name: Compare nav/footer/version/copyright across all pages
        run: node .github/scripts/check-page-scaffold.js

  check-hreflang:
    name: Réciprocité hreflang FR/EN (pages + sitemap)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install HTML parser
        run: npm install --no-save node-html-parser

      - name: Verify hreflang reciprocity across pages and sitemap.xml
        run: node .github/scripts/check-hreflang.js

  check-csp-hashes:
    name: CSP — scripts inline autorisés par hash
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify every inline script hash is allowlisted in _headers
        run: node .github/scripts/check-csp-hashes.js
